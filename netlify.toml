# Netlify configuration for React SPA

[build]
  # Build command for React app
  command = "npm run build"

  # Directory that contains the build output
  publish = "dist"

# Redirect rules for SPA routing
[[redirects]]
  from = "/specialties/aesthetic-and-reconstructive-surgery"
  to = "/aesthetic-&-reconstructive-surgery"
  status = 301
  force = true

[[redirects]]
  from = "/specialties/cardiology"
  to = "/cardiologist-and-heart-specialist-ranchi"
  status = 301
  force = true

